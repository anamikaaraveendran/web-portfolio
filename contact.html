<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Contact Section -->
    <section id="contact" class="contact-section">
        <div class="container">
            <h2 class="section-title fade-in-up">Let's Work Together</h2>
            <p class="section-intro fade-in-up">Have a project in mind? Let's build something amazing.</p>

            <div class="contact-container fade-in-up">
                <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                    <div class="form-group">
                        <input type="text" id="name" name="name" placeholder=" " required>
                        <label for="name">Your Name</label>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder=" " required>
                        <label for="email">Your Email</label>
                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" rows="5" placeholder=" " required></textarea>
                        <label for="message">Your Message</label>
                    </div>
                    <button type="submit" class="contact-button">Send Message <i class="fas fa-paper-plane"></i></button>
                </form>

                <div class="contact-info">
                    <h3>Contact Information</h3>
                    <p>I am currently open to internship opportunities, junior developer roles, and freelance projects.</p>

                    <div class="contact-item">
                        <div class="icon-box"><i class="fas fa-envelope"></i></div>
                        <div>
                            <strong>Email</strong>
                            <a href="mailto:anamikaar2004@gmail.com">anamikaar2004@gmail.com</a>
                        </div>
                    </div>

                    <div class="contact-item">
                        <div class="icon-box"><i class="fab fa-github"></i></div>
                        <div>
                            <strong>GitHub</strong>
                            <a href="https://github.com/anamikaaraveendran" target="_blank">github.com/anamikaaraveendran</a>
                        </div>
                    </div>

                    <div class="contact-item">
                        <div class="icon-box"><i class="fab fa-linkedin-in"></i></div>
                        <div>
                            <strong>LinkedIn</strong>
                            <a href="https://www.linkedin.com/in/anamika-r-480a94429" target="_blank">linkedin.com/in/anamika-r</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
